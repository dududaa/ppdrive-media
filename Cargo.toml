[workspace]
resolver = "3"
members = [
    "audio-conversion",
    "audio-conversion/plugin",
    "audio-effects",
    "image-conversion",
    "image-conversion/plugin",
    "image-transformation",
    "video-compression",
    "video-compression/plugin",
    "video-transformation",
]

[workspace.dependencies]
audio-conversion = { path = "audio-conversion", version = "0.1.0", package = "ppdrive-audio-conversion" }
image-conversion = { path = "image-conversion", package = "ppdrive-image-conversion" }
ppdrive = "0.2.0"
serde = "1.0.229"
serde_json = "1.0.151"
video-compression = { path = "video-compression", version = "0.1.0", package = "ppdrive-video-compression" }
