[package]
name = "ppdrive-video-transformation"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "High-performance video transformation library with FFmpeg as the native execution engine"
license = "MIT OR Apache-2.0"
readme = "README.MD"

[dependencies]
ppdrive.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ppff-video-conversion.workspace = true

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"

[lib]
name = "video_transformation"
crate-type = ["cdylib", "lib"]
