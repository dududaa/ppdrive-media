[package]
name = "ppff-media-streaming"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "HLS/DASH segmentation and adaptive streaming library with FFmpeg as the native execution engine"
license = "MIT OR Apache-2.0"
readme = "README.MD"

[dependencies]
ppff-audio-conversion.workspace = true
serde = { workspace = true, features = ["derive"] }
ppff-video-conversion.workspace = true

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"

[lib]
name = "ppff_media_streaming"
crate-type = ["lib"]
