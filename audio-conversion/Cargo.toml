[package]
name = "ppdrive-audio-conversion"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "High-performance audio conversion library with FFmpeg as the native execution engine"
license = "MIT OR Apache-2.0"
readme = "README.MD"

[dependencies]
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"

[lib]
name = "audio_conversion"
crate-type = ["lib"]
