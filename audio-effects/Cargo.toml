[package]
name = "ppdrive-audio-effects"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "High-performance audio effects library with FFmpeg (libavfilter) as the native execution engine"
license = "MIT OR Apache-2.0"
readme = "README.MD"

[dependencies]
audio-conversion.workspace = true
ppdrive.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"

[lib]
name = "audio_effects"
crate-type = ["cdylib", "lib"]
