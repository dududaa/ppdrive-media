name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            os_name: macos
            arch: x86_64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            os_name: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Rust (Windows/GNU host)
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Install FFmpeg (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -Syu --noconfirm
          C:\msys64\usr\bin\pacman.exe -Syu --noconfirm
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-toolchain `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-ffmpeg

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --locked --workspace
          cargo build --release --locked --workspace --examples

      - name: Build (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="/mingw64/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"
          export CARGO_TARGET_X86_64_UNKNOWN_WINDOWS_GNU_LINKER=gcc
          cargo build --release --locked --workspace
          cargo build --release --locked --workspace --examples

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          os="${{ matrix.os_name }}"
          arch="${{ matrix.arch }}"

          if [ "$os" = "windows" ]; then
            lib_ext="dll"
            bin_ext=".exe"
            archive_ext="zip"
          elif [ "$os" = "macos" ]; then
            lib_ext="dylib"
            bin_ext=""
            archive_ext="tar.gz"
          else
            lib_ext="so"
            bin_ext=""
            archive_ext="tar.gz"
          fi

          package() {
            pkg="$1"
            bin="$2"
            lib="$3"
            if [ "$os" = "windows" ]; then
              lib_file="${lib}.${lib_ext}"
              tar=(/c/Windows/System32/tar.exe -a -cf)
            else
              lib_file="lib${lib}.${lib_ext}"
              tar=(tar -czf)
            fi
            name="ppdrive-${pkg}-${os}-${arch}"
            rm -rf "$name"
            mkdir -p "$name"
            cp "target/release/${lib_file}" "$name/${name}.${lib_ext}"
            cp "target/release/examples/${bin}${bin_ext}" "$name/"
            cp "${pkg}/README.MD" "$name/README.MD"
            "${tar[@]}" "${name}.${archive_ext}" "$name"
          }

          package image-compression compress image_compression_plugin
          package image-transformation transform image_transformation
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-image-compression-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-image-compression-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-image-transformation-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-image-transformation-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ppdrive-*
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
